name: Build CRYPTO BOT PRO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf libtool pkg-config \
            zlib1g-dev libffi-dev libssl-dev \
            build-essential cmake

      - name: Configure Android SDK
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ]; then
            echo "Android SDK not found"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROIDSDK=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER=$(find "$SDK/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses || true
          "$SDKMANAGER" --sdk_root="$SDK" --install \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "ndk;25.2.9519653"

          echo "Checking Android build tools and AIDL"
          test -x "$SDK/build-tools/33.0.2/aidl"
          test -x "$SDK/build-tools/33.0.2/aapt"
          echo "Android SDK configured: $SDK"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade buildozer cython==0.29.36

      - name: Point Buildozer to configured Android SDK
        run: |
          set -e
          mkdir -p "$HOME/.buildozer/android/platform"
          ln -sfn "$ANDROID_HOME" "$HOME/.buildozer/android/platform/android-sdk"
          echo "Buildozer SDK path:"
          readlink -f "$HOME/.buildozer/android/platform/android-sdk"
          test -x "$HOME/.buildozer/android/platform/android-sdk/build-tools/33.0.2/aidl"
          test -x "$HOME/.buildozer/android/platform/android-sdk/build-tools/33.0.2/aapt"

      - name: Build Android APK
        run: |
          export ANDROIDSDK="$ANDROID_HOME"
          export ANDROIDNDK="$ANDROID_HOME/ndk/25.2.9519653"
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CRYPTO-BOT-PRO-APK
          path: bin/*.apk
          if-no-files-found: error
